[project]
name = "ai-buyer-agent"
version = "0.1.0"
description = "AI Purchasing Agent: investigates, decides, acts and validates purchasing decisions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=3.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
